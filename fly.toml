# fly.toml — production deployment for plaintext.gg
#
# See https://fly.io/docs/reference/configuration/ for the full reference.
#
# plaintext.gg is a static SPA: the Dockerfile builds the site with `vp build`
# and serves it from nginx on port 80. There is no backend, database, or
# persistent state, so no [[mounts]], [env], or release_command are needed.

app = 'plaintext-gg'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 80          # nginx listens on 80 (see nginx.conf / Dockerfile)
  force_https = true
  auto_stop_machines = 'off'  # always-on: never scale the machine to zero
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # nginx serves the SPA shell at / — use it as the readiness probe.
  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '256mb'
  cpus = 1
