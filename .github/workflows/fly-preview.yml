name: Fly Preview Apps

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

jobs:
  preview:
    runs-on: ubuntu-latest
    concurrency:
      group: pr-${{ github.event.number }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - id: deploy
        uses: superfly/fly-pr-review-apps@1.6.0
        with:
          name: plaintext-gg-pr-${{ github.event.number }}
          region: fra
          org: personal
          config: fly.preview.toml
          deploy_options: --depot=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Comment preview URL on PR
        if: github.event.action != 'closed' && steps.deploy.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: fly-preview
          message: |
            🚀 Preview deployed: ${{ steps.deploy.outputs.url }}

            This preview is updated on every push and torn down when the PR is closed.
